[workspace]
members = [
  "crates/mobile-contracts",
  "crates/mobile-domain",
  "crates/mobile-jurisdiction",
  "crates/mobile-models",
  "crates/mobile-store",
  "crates/mobile-sync",
  "crates/offline-core",
  "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Trey Murray"]
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.10.3", features = ["std", "zeroize"] }
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
uniffi = "0.31.2"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
zeroize = "1.8.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
