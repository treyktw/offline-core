name: OfflineCoreSample

options:
  bundleIdPrefix: com.example.offlinecore
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  OfflineCore:
    # Produced by ../../scripts/build-ios.sh
    path: ../../target/ios/OfflineCorePackage

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  OfflineCoreSample:
    type: application
    platform: iOS
    sources:
      - path: OfflineCoreSample
    info:
      path: OfflineCoreSample/Info.plist
      properties:
        CFBundleDisplayName: Offline Core
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.offlinecore
        PRODUCT_NAME: OfflineCoreSample
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: OfflineCore
        product: OfflineCore
